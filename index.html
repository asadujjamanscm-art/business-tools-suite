<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#122541">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>Business Tools Suite</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e1e7f0;--bg:#f3f6fb;--blue:#185adb}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
.shell{min-height:100dvh;display:flex;flex-direction:column}
.topbar{flex:none;background:linear-gradient(130deg,#122541,#2057a0);color:#fff;padding:calc(15px + env(safe-area-inset-top)) 16px 16px}
.brandline{display:flex;align-items:center;gap:10px}
.brandmark{width:38px;height:38px;border-radius:11px;background:#ffffff1c;display:grid;place-items:center;font-size:20px}
.brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.1px}
.brand p{font-size:11px;margin:3px 0 0;color:#d7e5ff}
#backBtn{display:none;border:1px solid #ffffff55;background:#ffffff18;color:#fff;border-radius:9px;padding:9px 12px;font-weight:700;font-size:13px}
#home{flex:1;overflow:auto;padding:22px 16px 30px;width:100%;max-width:760px;margin:0 auto}
.intro{margin:3px 2px 19px}
.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:800;color:#4772b3;text-transform:uppercase}
.intro h2{font-size:23px;margin:6px 0;color:#14243e}
.intro p{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.tools{display:grid;gap:13px}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 5px 18px #182d4d0a;cursor:pointer;color:inherit}
.tool:active{transform:scale(.99)}
.tool-icon{width:50px;height:50px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:24px}
.kyc .tool-icon{background:#eaf1ff} .cash .tool-icon{background:#e8f8ef} .sig .tool-icon{background:#f2edff} .bank .tool-icon{background:#eaf5ff} .salam .tool-icon{background:#fff2e7}
.tool-copy{flex:1;min-width:0}
.tool-copy strong{display:block;font-size:16px;margin-bottom:4px}
.tool-copy span{font-size:12px;color:var(--muted);line-height:1.4;display:block}
.arrow{font-size:22px;color:#8b98aa}
.footnote{font-size:11px;color:#8a94a5;text-align:center;margin:20px 0 0}
#appView{display:none;flex:1;min-height:70vh;background:#fff}
#appFrame{display:block;width:100%;height:100%;min-height:calc(100dvh - 75px);border:0;background:#fff}
@media(min-width:650px){#home{padding-top:32px}.tools{gap:15px}.tool{padding:19px}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brandline">
<button id="backBtn" type="button" onclick="goHome()">← Back</button>
<div class="brandmark" id="brandmark">▦</div>
<div class="brand"><h1 id="topTitle">Business Tools Suite</h1><p id="topSub">A unified workspace for everyday operations</p></div>
</div></header>
<main id="home">
<div class="intro"><div class="eyebrow">BUSINESS TOOLS SUITE</div><h2>Choose a tool</h2><p>Select a workspace below. Each tool opens in its own dedicated view.</p></div>
<div class="tools"><button class="tool kyc" onclick="openTool('kyc')" type="button">
      <span class="tool-icon">📋</span><span class="tool-copy"><strong>KYC PRA Form</strong><span>Complete merchant details and export a polished PNG form</span></span><span class="arrow">›</span>
    </button>
<button class="tool cash" onclick="openTool('cash')" type="button">
      <span class="tool-icon">💵</span><span class="tool-copy"><strong>Cash Denomination Calculator</strong><span>Calculate cash by denomination and export a clear PDF or PNG report</span></span><span class="arrow">›</span>
    </button>
<button class="tool sig" onclick="openTool('signature')" type="button">
      <span class="tool-icon">✍️</span><span class="tool-copy"><strong>Signature Studio</strong><span>Create or upload a signature, crop it, resize it and save as PNG</span></span><span class="arrow">›</span>
    </button>
<button class="tool bank" onclick="openTool('upay')" type="button">
      <span class="tool-icon">🏦</span><span class="tool-copy"><strong>Upay Bank Account</strong><span>View bank account details with branch and routing information</span></span><span class="arrow">›</span>
    </button>
<button class="tool salam" onclick="openTool('salam')" type="button">
      <span class="tool-icon">🏢</span><span class="tool-copy"><strong>Salam Traders Bank Accounts</strong><span>Access business bank accounts with quick copy options</span></span><span class="arrow">›</span>
    </button></div>
<p class="footnote">All tools run locally in your browser. Your information is not uploaded to a server.</p>
</main>
<section id="appView"><iframe id="appFrame" title="Selected business tool" sandbox="allow-scripts allow-forms allow-modals allow-downloads"></iframe></section>
</div>
